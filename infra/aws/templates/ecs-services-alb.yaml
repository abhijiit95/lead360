AWSTemplateFormatVersion: '2010-09-09'
Description: Staging ECS Fargate API/worker services and public HTTPS ALB.

Parameters:
  ClusterName:
    Type: String
    Default: lead360-staging
  VpcId:
    Type: String
  PublicSubnetIds:
    Type: CommaDelimitedList
    Description: At least two public subnet IDs in distinct Availability Zones.
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private ECS subnets in distinct Availability Zones.
  AlbSecurityGroupId:
    Type: String
  ApiSecurityGroupId:
    Type: String
  WorkerSecurityGroupId:
    Type: String
  ApiCertificateArn:
    Type: String
    Description: ACM certificate ARN for the API domain in this AWS region.
  ApiTaskDefinitionArn:
    Type: String
  WorkerTaskDefinitionArn:
    Type: String
  ApiDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
  WorkerDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1

Resources:
  LeadFlowCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ApiLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroupId]

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 4000
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /api/health/ready
      Matcher:
        HttpCode: '200'
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-api-targets' }]

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApiLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref ApiCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApiLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: lead360-api
      Cluster: !Ref LeadFlowCluster
      TaskDefinition: !Ref ApiTaskDefinitionArn
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref ApiDesiredCount
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref ApiSecurityGroupId]
          Subnets: !Ref PrivateSubnetIds
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 4000
          TargetGroupArn: !Ref ApiTargetGroup

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: lead360-worker
      Cluster: !Ref LeadFlowCluster
      TaskDefinition: !Ref WorkerTaskDefinitionArn
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref WorkerDesiredCount
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref WorkerSecurityGroupId]
          Subnets: !Ref PrivateSubnetIds

Outputs:
  EcsClusterName: { Value: !Ref LeadFlowCluster }
  ApiLoadBalancerDnsName: { Value: !GetAtt ApiLoadBalancer.DNSName }
  ApiLoadBalancerCanonicalHostedZoneId: { Value: !GetAtt ApiLoadBalancer.CanonicalHostedZoneID }
  ApiTargetGroupArn: { Value: !Ref ApiTargetGroup }
