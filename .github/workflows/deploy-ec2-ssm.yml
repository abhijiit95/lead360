name: Deploy LeadFlow360 to EC2 through SSM

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA of a main-branch commit whose CI and both ECR publish jobs succeeded
        required: true
        type: string
      confirm_ec2_deploy:
        description: Confirm deployment of the selected SHA to the configured EC2 instance
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: leadflow360-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.EC2_DEPLOY_ENABLED == 'true' &&
      vars.ECR_FRONTEND_PUBLISH_ENABLED == 'true' &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == 'refs/heads/main' &&
         inputs.confirm_ec2_deploy == true)
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the exact commit that will be deployed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha }}

      - name: Validate target and select the CI run
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_CI_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$CI_CONCLUSION" == "success" && "$CI_EVENT" == "push" && "$CI_BRANCH" == "main" ]] || {
              echo "Deployment requires a successful CI push run on main."
              exit 1
            }
            sha="$SOURCE_CI_SHA"
            run_id="$SOURCE_CI_RUN_ID"
          else
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "Manual deployment must be started from main."
              exit 1
            }
            sha="$MANUAL_SHA"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "commit_sha must be a full lowercase Git SHA."
              exit 1
            }
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&branch=main&event=push&per_page=100" \
              > "${RUNNER_TEMP}/ci-runs.json"
            run_id="$(node - "${RUNNER_TEMP}/ci-runs.json" "$sha" <<'NODE'
          const fs = require('node:fs');
          const sha = process.argv[3];
          const runs = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).workflow_runs ?? [];
          const run = runs.find((item) => item.head_sha === sha && item.event === 'push'
            && item.head_branch === 'main' && item.status === 'completed' && item.conclusion === 'success');
          if (run) process.stdout.write(String(run.id));
          NODE
          )"
            [[ -n "$run_id" ]] || {
              echo "No successful main push CI run exists for the requested SHA."
              exit 1
            }
          fi

          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "CI did not report a full lowercase Git SHA."
            exit 1
          }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            > "${RUNNER_TEMP}/ci-jobs.json"
          node - "${RUNNER_TEMP}/ci-jobs.json" "$sha" <<'NODE'
          const fs = require('node:fs');
          const jobs = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).jobs ?? [];
          const required = ['build-and-test', 'publish-backend-to-ecr', 'publish-frontend-to-ecr'];
          for (const name of required) {
            const job = jobs.find((item) => item.name === name);
            if (!job || job.status !== 'completed' || job.conclusion !== 'success') {
              console.error(`Required CI job did not succeed: ${name}`);
              process.exit(1);
            }
          }
          console.log(`Verified build/tests and both ECR image publications for ${process.argv[3]}.`);
          NODE
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Validate deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_SSM_DEPLOY_ROLE_ARN: ${{ vars.AWS_SSM_DEPLOY_ROLE_ARN }}
          EC2_DEPLOY_ENABLED: ${{ vars.EC2_DEPLOY_ENABLED }}
          ECR_FRONTEND_PUBLISH_ENABLED: ${{ vars.ECR_FRONTEND_PUBLISH_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AWS_REGION" == "us-east-1" ]] || { echo "AWS_REGION must be us-east-1."; exit 1; }
          [[ "$EC2_INSTANCE_ID" == "i-08b344c2c5a9f02b8" ]] || { echo "EC2_INSTANCE_ID does not match the verified target."; exit 1; }
          [[ "$AWS_SSM_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::531767454878:role/.+$ ]] || { echo "Set AWS_SSM_DEPLOY_ROLE_ARN to the dedicated deployment role."; exit 1; }
          [[ "$EC2_DEPLOY_ENABLED" == "true" && "$ECR_FRONTEND_PUBLISH_ENABLED" == "true" ]] || { echo "Deployment and frontend ECR publishing gates must both be enabled."; exit 1; }

      - name: Configure AWS access through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_SSM_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Confirm assumed account
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$account" == "531767454878" ]] || { echo "Assumed role belongs to an unexpected AWS account."; exit 1; }

      - name: Send protected deployment script through SSM and wait for health checks
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          compressed_script="$(gzip -9c infra/aws/scripts/deploy-ec2-images.sh | base64 -w0)"
          python3 - "${RUNNER_TEMP}/ssm-command.json" "$DEPLOY_SHA" "$EC2_INSTANCE_ID" "$compressed_script" <<'PY'
          import json
          import shlex
          import sys

          output_path, sha, instance_id, compressed = sys.argv[1:]
          remote_script = (
              "set -euo pipefail; "
              "script=$(mktemp /tmp/lead360-ssm-XXXXXXXX.sh); "
              "trap 'rm -f -- \"$script\"' EXIT; "
              f"printf '%s' {shlex.quote(compressed)} | base64 -d | gzip -d > \"$script\"; "
              "chmod 700 \"$script\"; "
              f"bash \"$script\" {shlex.quote(sha)}"
          )
          remote = "bash -c " + shlex.quote(remote_script)
          request = {
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": [instance_id],
              "Parameters": {"commands": [remote]},
              "TimeoutSeconds": 1800,
              "Comment": f"LeadFlow360 deploy {sha}",
          }
          with open(output_path, "w", encoding="utf-8") as output:
              json.dump(request, output)
          PY

          command_id="$(aws ssm send-command \
            --cli-input-json "file://${RUNNER_TEMP}/ssm-command.json" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command submitted: ${command_id}"

          for attempt in $(seq 1 210); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                echo "SSM deployment command ended with status ${status}."
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardErrorContent --output text || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for the SSM deployment command."
          exit 1
