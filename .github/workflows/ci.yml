name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Test backend
        run: npm test
        working-directory: backend

      - name: Run backend integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build backend Docker image
        run: docker build --file backend/Dockerfile --tag lead360-api:ci backend

      - name: Build frontend Docker image
        run: >-
          docker build
          --file frontend/Dockerfile
          --build-arg VITE_API_BASE_URL=
          --build-arg FRONTEND_BUILD_ENV=production
          --tag lead360-frontend:ci
          frontend

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve lowercase GHCR owner
        id: image-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image-owner.outputs.owner }}/lead360-api:${{ github.sha }}
            ghcr.io/${{ steps.image-owner.outputs.owner }}/lead360-api:latest

      - name: Build and publish frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=
            FRONTEND_BUILD_ENV=production
          tags: |
            ghcr.io/${{ steps.image-owner.outputs.owner }}/lead360-frontend:${{ github.sha }}
            ghcr.io/${{ steps.image-owner.outputs.owner }}/lead360-frontend:latest

  publish-backend-to-ecr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::531767454878:role/GitHubActionsECRPushRole
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push backend image
        shell: bash
        env:
          ECR_IMAGE: 531767454878.dkr.ecr.us-east-1.amazonaws.com/lead360-api
        run: |
          set -euo pipefail
          docker build \
            --file backend/Dockerfile \
            --tag "${ECR_IMAGE}:${GITHUB_SHA}" \
            backend
          docker push "${ECR_IMAGE}:${GITHUB_SHA}"

  publish-frontend-to-ecr:
    # Keep this off until lead360-frontend exists and the existing GitHub OIDC
    # publisher role has the narrowly scoped policy documented in infra/aws.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ECR_FRONTEND_PUBLISH_ENABLED == 'true'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::531767454878:role/GitHubActionsECRPushRole
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=
            FRONTEND_BUILD_ENV=production
          tags: 531767454878.dkr.ecr.us-east-1.amazonaws.com/lead360-frontend:${{ github.sha }}
